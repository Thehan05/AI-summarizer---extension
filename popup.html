<html>  
    <meta charset="UTF-8">
<head>
    <title>Popup</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header>    
        <div class="title">
            <div class="logo">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="white">
                <path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/>

            </div>
